{% extends "base.html" %}{% block title %}Forgot password{% endblock %}
{% block content %}
<h1>Forgot your password?</h1>
<p>Type your email address and we will email you a link to choose a new password.</p>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf() }}">
  <label for="e">Email</label><input id="e" name="email" type="email" required>
  <p><button class="btn">Send reset link</button></p>
</form>
<p><a href="{{ url_for('login') }}">Back to sign in</a></p>
{% endblock %}
