{% extends "base.html" %}{% block title %}{{ 'Reset password' if reset else 'Finish registration' }}{% endblock %}
{% block content %}
<h1>{{ 'Choose a new password' if reset else 'Finish setting up your account' }}</h1>
<p>Account: <strong>{{ u.email or u.username }}</strong></p>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf() }}">
  {% if not reset %}<label for="dn">Your name</label><input id="dn" name="display_name" type="text" value="{{ u.display_name }}">{% endif %}
  <label for="n">New password (10+ characters)</label><input id="n" name="new" type="password" autocomplete="new-password" minlength="10" required>
  <label for="a">Type it again</label><input id="a" name="again" type="password" autocomplete="new-password" minlength="10" required>
  <p><button class="btn">{{ 'Save password' if reset else 'Finish registration' }}</button></p>
</form>
{% endblock %}
