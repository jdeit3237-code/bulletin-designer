{% extends "base.html" %}{% block title %}Sections{% endblock %}
{% block content %}
<h1>Sections and layout</h1>
<p>Set print order, pages per section, and whether a section changes weekly (starts empty) or is standing (carried forward).</p>
{% for s in secs %}
<form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}"><input type="hidden" name="sid" value="{{ s.id }}">
  <fieldset><legend>{{ s.title }}</legend>
    <label for="t{{ s.id }}">Title</label><input id="t{{ s.id }}" name="title" type="text" value="{{ s.title }}">
    <label for="p{{ s.id }}">Pages (1-8)</label><input id="p{{ s.id }}" name="pages" type="number" min="1" max="8" value="{{ s.pages }}">
    <label for="o{{ s.id }}">Order</label><input id="o{{ s.id }}" name="position" type="number" value="{{ s.position }}">
    <label><input type="checkbox" name="weekly" {{ 'checked' if s.weekly }}> Changes every week</label>
    <p><button class="btn">Save</button></p>
  </fieldset>
</form>
{% endfor %}
{% endblock %}
