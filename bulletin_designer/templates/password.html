{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block content %}
<h1>Change password</h1>
{% if g.user.must_reset %}<p>You must choose a new password before continuing.</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf() }}">
  <label for="c">Current password</label><input id="c" name="current" type="password" autocomplete="current-password" required>
  <label for="n">New password (10+ characters)</label><input id="n" name="new" type="password" autocomplete="new-password" minlength="10" required>
  <p><button class="btn">Update password</button></p>
</form>
{% endblock %}
